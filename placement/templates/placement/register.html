{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Register | CareerLaunch</title>

<link rel="stylesheet" href="{% static 'placement/css/style.css' %}">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body {
        min-height: 100vh;
        margin: 0;
        background:
            radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 35%),
            radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.14), transparent 35%),
            #f8fafc;
    }

    .register-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .register-card {
        position: relative;
        width: 100%;
        max-width: 520px;
        padding: 42px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.12);
        overflow: hidden;
    }

    .register-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, #4f46e5, #7c3aed, #06b6d4);
    }

    .register-logo {
        text-align: center;
        margin-bottom: 30px;
    }

    .register-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        background: linear-gradient(135deg, #eef2ff, #f5f3ff);
        color: #4f46e5;
        font-size: 34px;
        box-shadow: 0 10px 25px rgba(79, 70, 229, 0.12);
    }

    .register-logo h2 {
        margin: 0 0 8px;
        color: #0f172a;
        font-size: 1.8rem;
        font-weight: 800;
    }

    .register-logo p {
        margin: 0;
        color: #64748b;
        font-size: 0.92rem;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 0.9rem;
        font-weight: 700;
    }

    .input-wrapper {
        position: relative;
    }

    .input-wrapper i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        font-size: 1rem;
    }

    .form-control {
        width: 100%;
        box-sizing: border-box;
        padding: 13px 15px 13px 43px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        background: #f8fafc;
        color: #0f172a;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s ease,
                    box-shadow 0.2s ease,
                    background 0.2s ease;
    }

    .form-control::placeholder {
        color: #94a3b8;
    }

    .form-control:focus {
        background: white;
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .register-btn {
        width: 100%;
        padding: 14px;
        margin-top: 5px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        font-size: 1rem;
        font-weight: 750;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(79, 70, 229, 0.22);
        transition: transform 0.2s ease,
                    box-shadow 0.2s ease;
    }

    .register-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 32px rgba(79, 70, 229, 0.30);
    }

    .login-link {
        margin-top: 25px;
        padding-top: 22px;
        border-top: 1px solid #e2e8f0;
        text-align: center;
        color: #64748b;
        font-size: 0.9rem;
    }

    .login-link a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 750;
    }

    .login-link a:hover {
        color: #3730a3;
        text-decoration: underline;
    }

    .register-footer {
        margin-top: 18px;
        text-align: center;
        color: #94a3b8;
        font-size: 0.78rem;
    }

    @media (max-width: 520px) {
        .register-section {
            padding: 25px 15px;
        }

        .register-card {
            padding: 32px 24px;
            border-radius: 20px;
        }

        .register-logo h2 {
            font-size: 1.55rem;
        }
    }
</style>


</head>

<body>

<section class="register-section">


<div class="register-card">

    <div class="register-logo">

        <div class="register-icon">
            <i class="bi bi-rocket-takeoff-fill"></i>
        </div>

        <h2>Create Your Account</h2>

        <p>Start your placement preparation journey</p>

    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label class="form-label">Full Name</label>

            <div class="input-wrapper">
                <i class="bi bi-person-vcard-fill"></i>

                <input
                    type="text"
                    name="full_name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required
                >
            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Email Address</label>

            <div class="input-wrapper">
                <i class="bi bi-envelope-fill"></i>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >
            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Username</label>

            <div class="input-wrapper">
                <i class="bi bi-person-fill"></i>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Choose a username"
                    required
                >
            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Password</label>

            <div class="input-wrapper">
                <i class="bi bi-lock-fill"></i>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required
                >
            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Confirm Password</label>

            <div class="input-wrapper">
                <i class="bi bi-shield-lock-fill"></i>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm your password"
                    required
                >
            </div>

        </div>

        <button type="submit" class="register-btn">
            <i class="bi bi-person-plus-fill"></i>
            Create CareerLaunch Account
        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="{% url 'login' %}">
            Login here
        </a>

    </div>

    <div class="register-footer">
        <i class="bi bi-shield-check"></i>
        Start preparing smarter for your placement journey
    </div>

</div>


</section>

</body>
</html>
